name: Actualizar Datos de FBref Mensualmente

on:
  schedule:
    # Se ejecuta el día 1 de cada mes a las 00:00 UTC (aprox. 21:00 del día anterior en Chile)
    - cron: '0 0 1 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para que el robot pueda hacer commit y push

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml

      - name: Ejecutar scraper
        run: python scraper.py

      - name: Commit y Push si hay cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/data.csv
          # El comando 'git diff --staged --quiet' devuelve 0 si no hay cambios, y 1 si los hay.
          # Si hay cambios, se ejecuta el commit y el push.
          git diff --staged --quiet || (git commit -m "Auto-update: Datos de FBref $(date +'%Y-%m')" && git push)