name: Actualizar Datos de FBref (Manual)

on:
  workflow_dispatch: # Solo se activa si tú lo ejecutas manualmente desde GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso para que el bot haga commit

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas cloudscraper lxml

      - name: Ejecutar scraper
        run: python scraper.py

      - name: Commit y Push si hay cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/data.csv
          git diff --staged --quiet || (git commit -m "Auto-update: Datos de FBref" && git push)